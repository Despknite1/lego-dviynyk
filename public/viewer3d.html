<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D мініфігурка</title>
<style>html,body{margin:0;height:100%;background:#0b0d13;color:#e9ecf2;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#wrap{display:flex;height:100%}#main{position:relative;flex:1;min-width:0}#c{width:100%;height:100%;display:block}
#side{width:340px;border-left:1px solid #2a2f3c;display:flex;flex-direction:column;background:linear-gradient(180deg,#171a24,#11131a)}
#mini{width:100%;height:240px;display:block;background:#1c2130;border-bottom:3px solid #e3000b}
#minihdr{font-size:12px;padding:8px 12px;color:#c9cfdc;min-height:30px}#minihdr b{color:#ffd500}#plist{overflow:auto;flex:1;font-size:12px;padding:6px 10px;color:#dfe3ec}
#plist>b{color:#ffd500;font-size:14px}#plist .row{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin:3px 0;background:#1a1e2a}
#plist .row:hover{border-color:#3a4258}#plist .row.sel{border-color:#ffd500;background:#262b3a}#plist .row span[style*="color:#555"]{color:#aab2c4!important}
#plist .sw{width:16px;height:16px;border-radius:4px;border:1px solid #000;box-shadow:inset 0 -3px 0 #0003;flex:none;margin-top:2px}#plist a{color:#6fb0ff}#plist code{color:#ffd500}
.lk{filter:drop-shadow(0 1px 0 #000)}
.bar{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.bar button{border:0;border-radius:10px;padding:9px 14px;background:#ffd500;color:#111;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #a88c00,0 6px 14px #0006;font-size:13px}
.bar button:active{transform:translateY(2px);box-shadow:0 1px 0 #a88c00}#rot.on{background:#e3000b;color:#fff;box-shadow:0 3px 0 #8f0007}
#msg{position:absolute;top:12px;left:0;right:0;text-align:center;color:#9aa3b5;font-size:14px}
@media(max-width:760px){html,body{overflow:auto;height:auto}#wrap{flex-direction:column;height:auto}#main{height:70vh;min-height:420px;flex:none}#side{width:auto;border-left:0;border-top:1px solid #2a2f3c}#plist{max-height:none}}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body><div id="wrap"><div id="main"><canvas id="c"></canvas><div id="msg">Завантаження деталей LDraw…</div>
<div class="bar"><button data-v="front">Спереду</button><button data-v="side">Збоку</button><button data-v="back">Ззаду</button><button data-v="three">3/4</button><button id="rot">⟳ Обертати</button><button id="png">⬇ PNG</button></div></div>
<div id="side"><canvas id="mini"></canvas><div id="minihdr">Натисніть деталь, щоб роздивитися її окремо (можна обертати мишею).</div><div id="plist"><b>Деталі</b></div></div></div>
<script type="module" src="/viewer3d.js"></script></body></html>
